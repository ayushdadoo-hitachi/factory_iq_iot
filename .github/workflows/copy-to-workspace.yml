name: Copy code to Databricks Workspace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      # What to upload (change to '.' or 'src/jobs' if you prefer)
      LOCAL_DIR: src
      # Where in Workspace to put it (plain env var, not a secret)
      WORKSPACE_PATH: /Users/ayush.dadoo.ext@hitachirail.net/factory_iq_iot
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Databricks CLI (legacy)
        run: |
          python -m pip install --upgrade pip
          pip install "databricks-cli<0.18"

      - name: Configure Databricks CLI profile (from existing secrets)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          printf "[DEFAULT]\nhost = %s\ntoken = %s\n" "$DATABRICKS_HOST" "$DATABRICKS_TOKEN" > ~/.databrickscfg
          chmod 600 ~/.databrickscfg

      - name: Ensure target folder exists in Workspace
        run: |
          databricks workspace mkdirs "$WORKSPACE_PATH"

      - name: Upload source tree to Workspace
        run: |
          # Note: --format/--language are NOT supported on import_dir in CLI v0.17.x
          databricks workspace import_dir --overwrite "$LOCAL_DIR" "$WORKSPACE_PATH"

      - name: List uploaded path (verify)
        run: |
          echo "Contents of $WORKSPACE_PATH:"
          databricks workspace list "$WORKSPACE_PATH" || true