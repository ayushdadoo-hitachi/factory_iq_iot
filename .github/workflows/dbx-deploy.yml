name: dbx deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbx and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "databricks-cli<0.18" "dbx==0.8.19"
          pip install "click==8.1.7" "typer==0.7.0" "rich==12.6.0"

      - name: Configure Databricks CLI profile
        shell: bash
        run: |
          # Remove existing file or folder if present
          rm -rf ~/.databrickscfg

          # Create a new FILE (not a folder)
          cat << 'EOF' > ~/.databrickscfg
[DEFAULT]
host = $DATABRICKS_HOST
token = $DATABRICKS_TOKEN
EOF
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Use legacy CLI (required for dbx)
        shell: bash
        run: echo "DATABRICKS_CLI_DO_NOT_EXECUTE_NEWER_VERSION=1" >> $GITHUB_ENV

      - name: Deploy workflow(s)
        run: dbx deploy --environment default

      - name: Launch workflow (optional)
        run: dbx launch --environment default --job factory_hourly_refresh