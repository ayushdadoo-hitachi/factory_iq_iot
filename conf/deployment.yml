# conf/deployment.yml
# -----------------------------------------------------------------------------
# dbx deployment configuration (YAML)
# - Keeps a reusable cluster block via YAML anchors.
# - Disables packaging/build (no wheel) to avoid pip build errors.
# - Ships/executes your code directly from the repo via file:// path.
# -----------------------------------------------------------------------------

# Reusable bits (anchors) for clusters you can reference across jobs
custom:
  basic-cluster-props: &basic-cluster-props
    # Databricks Runtime version. You can change later (e.g., "14.3.x-scala2.12")
    spark_version: "11.3.x-cpu-ml-scala2.12"

  basic-static-cluster: &basic-static-cluster
    new_cluster:
      <<: *basic-cluster-props
      num_workers: 1
      node_type_id: "Standard_E8_v3"

# Turn OFF Python package build (wheel). We’ll run files directly from the repo.
build:
  no_build: true

environments:
  default:

    # If you want to keep the sample workflows, leave them here (optional).
    # You can remove or comment these out later to keep the file tidy.
    workflows:
      # ------------------------- YOUR WORKFLOW -------------------------------
      - name: factory_hourly_refresh
        tasks:
          - task_key: main
            <<: *basic-static-cluster

            # Don’t attach a wheel/package; run directly from the repo.
            deployment_config:
              no_package: true

            # Run your Python file from source.
            spark_python_task:
              python_file: "file://src/jobs/factory_hourly_refresh/factory_hourly_refresh.py"

